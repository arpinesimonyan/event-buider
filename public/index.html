<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">

  <div class="ticket">
    <div class="eyebrow">Run Sheet · Draft</div>
    <h1 id="titleDisplay">Event Builder</h1>
    <div class="meta-row">
      <div class="meta-field">
        <label>Event Name</label>
        <input type="text" id="eventName" placeholder="e.g. Q3 Partner Summit">
      </div>
      <div class="meta-field">
        <label>Event Date</label>
        <input type="date" id="eventDate">
      </div>
      <div class="meta-field">
        <label>Location / City</label>
        <input type="text" id="eventCity" placeholder="e.g. Yerevan">
      </div>
    </div>
  </div>

  <div class="ruler">
    <div class="ruler-total" id="totalPct">0%</div>
    <div class="ruler-track">
      <div class="ruler-ticks" id="ticks"></div>
      <div class="tick-labels">
        <span>Transport</span><span>Translations</span><span>Venue</span><span>Meal</span><span>Logistics</span>
      </div>
    </div>
  </div>

  <div class="mosaic" id="mosaic"></div>

  <div class="footer">
    <div class="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
    <div class="btns">
      <button class="ghost" id="resetBtn">Reset</button>
      <button class="primary" id="exportBtn">Export Summary</button>
    </div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
